<!DOCTYPE html>
<!-- ParthdeliveryGen1 : Delivery Partner Panel (Unique Code Login) -->
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Parth Delivery Partner</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f7fc;--card:#fff;--card2:#f1f5f9;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--primary:#0ea5e9;--accent:#6366f1;--good:#10b981;--warn:#f59e0b;--bad:#ef4444;--grad:linear-gradient(135deg,var(--primary),var(--accent));--shadow:0 8px 30px rgba(2,6,23,.08)}
[data-theme="dark"]{--bg:#0b1020;--card:#151d3a;--card2:#1e293b;--line:#2a3654;--text:#e6eaf6;--muted:#94a3b8;--primary:#38bdf8;--accent:#818cf8;--good:#34d399;--warn:#fbbf24;--bad:#f87171;--shadow:0 8px 30px rgba(0,0,0,.4)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px;transition:background .3s}
button,input{font-family:inherit;outline:none;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Pacifico';font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-actions{display:flex;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--muted);cursor:pointer;font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.hello{background:var(--grad);border-radius:20px;color:#fff;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hello h2{font-size:20px;font-weight:800}
.hello p{font-size:13px;opacity:.9}
.hello .code-chip{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat .n{font-size:22px;font-weight:800;color:var(--primary)}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sec{font-size:14px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:8px}
.order-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.oc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.oc-id{font-weight:800;color:var(--primary)}
.badge{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800}
.badge.pending{background:rgba(245,158,11,.15);color:var(--warn)}
.badge.picked_up{background:rgba(14,165,233,.15);color:var(--primary)}
.badge.out_for_delivery{background:rgba(99,102,241,.15);color:var(--accent)}
.badge.delivered{background:rgba(16,185,129,.15);color:var(--good)}
.badge.express{background:rgba(245,158,11,.2);color:var(--warn)}
.oc-name{font-weight:700;font-size:15px;margin-bottom:2px}
.oc-addr{font-size:12px;color:var(--muted);margin-bottom:10px}
.oc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card2);border:1px solid var(--line);padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700}
.oc-actions{display:flex;gap:8px;margin-bottom:10px}
.oc-actions a{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:700;text-decoration:none}
.oc-actions a.call{border-color:var(--good);color:var(--good)}
.oc-actions a.map{border-color:var(--primary);color:var(--primary)}
.btn-main{width:100%;padding:14px;border-radius:14px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:disabled{opacity:.5}
.btn-main.done{background:var(--good)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty i{font-size:40px;opacity:.4;margin-bottom:10px;display:block}
/* LOGIN */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 28px;max-width:380px;width:100%;text-align:center;box-shadow:var(--shadow)}
.login-box .lg{font-family:'Pacifico';font-size:26px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:14px;border-radius:14px;margin:16px 0 12px;font-size:16px;text-align:center;letter-spacing:2px;text-transform:uppercase}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);z-index:99;display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<div id="toast"></div>
<!-- LOGIN -->
<div class="login" id="loginScreen">
 <div class="login-box">
  <div class="lg">Parth</div>
  <p style="color:var(--muted);font-size:12px;letter-spacing:1px;margin-top:2px">DELIVERY PARTNER</p>
  <input id="codeInput" placeholder="ENTER CODE" maxlength="10"/>
  <button class="btn-main" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Login</button>
  <p id="loginErr" style="color:var(--bad);font-size:12px;margin-top:10px;display:none">❌ Galat code. Admin se code lo.</p>
 </div>
</div>
<!-- APP -->
<div id="app" style="display:none">
 <div class="top">
  <span class="brand">Parth Delivery</span>
  <div class="top-actions">
   <button class="icon-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
   <button class="icon-btn" id="logoutBtn"><i class="fas fa-power-off"></i></button>
  </div>
 </div>
 <div class="wrap">
  <div class="hello"><span class="code-chip" id="myCode">—</span><h2 id="helloName">Hello 👋</h2><p>Aaj ki deliveries neeche hai</p></div>
  <div class="stats">
   <div class="stat"><div class="n" id="sActive">0</div><div class="l">Active</div></div>
   <div class="stat"><div class="n" id="sToday">0</div><div class="l">Aaj Done</div></div>
   <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
  </div>
  <div class="sec"><i class="fas fa-box" style="color:var(--primary)"></i> Active Orders</div>
  <div id="activeList"></div>
  <div class="sec"><i class="fas fa-circle-check" style="color:var(--good)"></i> Delivered Today</div>
  <div id="doneList"></div>
 </div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyCmVME9gp1a-jI_82knnJ-ZIkFZvTLzp2w",authDomain:"parth-dry-clean.firebaseapp.com",databaseURL:"https://parth-dry-clean-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"parth-dry-clean",storageBucket:"parth-dry-clean.firebasestorage.app",messagingSenderId:"673481985335",appId:"1:673481985335:web:eb4194b4860cf979b21eb2"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth();const db=firebase.database();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
const $=id=>document.getElementById(id);
let BOY=JSON.parse(localStorage.getItem('pdc_boy')||'null'), ordersRef=null;
const LABEL={pending:'Pending',picked_up:'Picked Up',out_for_delivery:'Out for Delivery',delivered:'Delivered'};
function toast(m,t){const el=$('toast');el.innerHTML=`<i class="fas fa-${t==='err'?'circle-exclamation':'circle-check'}" style="color:${t==='err'?'var(--bad)':'var(--good)'}"></i>${m}`;el.style.display='flex';setTimeout(()=>el.style.display='none',2500);}
$('themeBtn').onclick=()=>{const l=document.documentElement.getAttribute('data-theme')==='dark';document.documentElement.setAttribute('data-theme',l?'light':'dark');$('themeBtn').innerHTML=l?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>';localStorage.setItem('pdc_dtheme',l?'light':'dark');};
if(localStorage.getItem('pdc_dtheme')==='dark'){document.documentElement.setAttribute('data-theme','dark');$('themeBtn').innerHTML='<i class="fas fa-sun"></i>';}
$('logoutBtn').onclick=()=>{localStorage.removeItem('pdc_boy');BOY=null;auth.signOut();location.reload();};
// LOGIN with unique code
$('loginBtn').onclick=()=>{
 const code=($('codeInput').value||'').trim().toUpperCase();
 if(!code)return;
 $('loginErr').style.display='none';
 db.ref('delivery_boys').orderByChild('code').equalTo(code).once('value').then(s=>{
   if(!s.exists()){$('loginErr').style.display='block';return;}
   let boy=null;s.forEach(c=>boy={id:c.key,...c.val()});
   auth.signInAnonymously().then(()=>{
     const uid=auth.currentUser.uid;
     const phoneE164='+91'+boy.phone;
     db.ref('boy_sessions/'+uid).set({phone:boy.phone,phoneE164,name:boy.name,boyId:boy.id}).then(()=>{
       BOY={...boy,phoneE164};localStorage.setItem('pdc_boy',JSON.stringify(BOY));
       enterApp();
     });
   });
 }).catch(()=>{$('loginErr').style.display='block';});
};
function enterApp(){
 $('loginScreen').style.display='none';$('app').style.display='block';
 $('helloName').textContent='Hello, '+(BOY.name||'Partner')+' 👋';
 $('myCode').textContent=BOY.code||'—';
 listen();
}
function listen(){
 if(ordersRef)ordersRef.ref.off('value',ordersRef.cb);
 const ref=db.ref('orders').orderByChild('assigned_to_e164').equalTo(BOY.phoneE164);
 const cb=ref.on('value',s=>{render(s);},{ });
 ordersRef={ref,cb};
}
function dayStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function render(s){
 const today=dayStr(new Date());let act=[],done=[];let total=0;
 s.forEach(c=>{const o=c.val();if(!o)return;if(o.status==='delivered'){total++;if((o.deliveredAt?dayStr(new Date(o.deliveredAt)):'')===today)done.push(o);}else act.push(o);});
 act.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
 $('sActive').textContent=act.length;$('sToday').textContent=done.length;$('sTotal').textContent=total;
 $('activeList').innerHTML=act.length?act.map(o=>{
  const st=o.status||'pending';
  const items=Object.entries(o.items||{}).map(([k,v])=>`<span class="chip">${k} x${v}</span>`).join('');
  let btn='';
  if(st==='pending')btn=`<button class="btn-main" onclick="adv('${o._id||o.id}','picked_up')"><i class="fas fa-box"></i> Start Pickup</button>`;
  else if(st==='picked_up')btn=`<button class="btn-main" onclick="adv('${o._id||o.id}','out_for_delivery')"><i class="fas fa-truck"></i> Start Delivery</button>`;
  else if(st==='out_for_delivery')btn=`<button class="btn-main done" onclick="adv('${o._id||o.id}','delivered')"><i class="fas fa-check"></i> Mark Delivered</button>`;
  return `<div class="order-card">
   <div class="oc-top"><span class="oc-id">#${o.orderId||o.id}</span><span>${o.express==='Yes'?'<span class="badge express">⚡ Express</span>':''} <span class="badge ${st}">${LABEL[st]||st}</span></span></div>
   <div class="oc-name">${o.customerName||o.name||'-'}</div>
   <div class="oc-addr"><i class="fas fa-location-dot"></i> ${o.address||'-'}</div>
   <div class="oc-meta">${items}<span class="chip">₹${o.total||0}</span><span class="chip">${o.timeSlot||''}</span></div>
   <div class="oc-actions"><a class="call" href="tel:+91${(o.phone||'').replace(/\D/g,'')}"><i class="fas fa-phone"></i> Call</a><a class="map" target="_blank" href="https://maps.google.com/?q=${encodeURIComponent(o.address||'')}"><i class="fas fa-map"></i> Map</a></div>
   ${btn}
  </div>`;
 }).join(''):'<div class="empty"><i class="fas fa-mug-hot"></i>Koi active order nahi. Aaram karo! ☕</div>';
 $('doneList').innerHTML=done.length?done.map(o=>`<div class="order-card" style="padding:12px 16px"><div class="oc-top"><span class="oc-id">#${o.orderId||o.id}</span><span class="badge delivered">✅ ₹${o.total||0}</span></div><div class="oc-name" style="font-size:13px">${o.customerName||o.name||'-'}</div></div>`).join(''):'<div class="empty"><i class="fas fa-circle-check"></i>Aaj abhi koi delivery nahi</div>';
}
window.adv=(id,next)=>{
 const up={status:next};
 if(next==='delivered'){up.deliveredAt=firebase.database.ServerValue.TIMESTAMP; if(BOY&&BOY.id)db.ref('delivery_boys/'+BOY.id+'/total_deliveries').transaction(v=>(v||0)+1);}
 db.ref('orders/'+id).update(up).then(()=>toast(next==='delivered'?'🎉 Delivered!':'Status updated')).catch(e=>toast(e.message,'err'));
};
// auto-enter if session exists
if(BOY){ auth.onAuthStateChanged(u=>{ if(u){enterApp();} else { auth.signInAnonymously().then(()=>{ if(BOY)db.ref('boy_sessions/'+auth.currentUser.uid).set({phone:BOY.phone,phoneE164:BOY.phoneE164,name:BOY.name,boyId:BOY.id}); }); } }); }
console.log('🛵 Parth Delivery Partner online');
</script>
</body>
</html>
